# Render Blueprint — Block L Residents Portal
# Dashboard: New + Blueprint → connect this Git repo

services:
  - type: web
    name: block-l-residents-portal
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: BLOCK L RESIDENTS PORTAL
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: block-l-residents-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSET_URL
        fromService:
          name: block-l-residents-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: DATABASE_URL
        fromDatabase:
          name: block-l-db
          property: connectionString

databases:
  - name: block-l-db
    plan: free
    databaseName: block_l
    user: block_l_user