# Render Blueprint — Block L Residents Portal
# Dashboard: New + Blueprint → connect this Git repo

services:
  - type: web
    name: block-l-residents-portal
    runtime: docker
    repo: https://github.com/hermanedward009-rgb/block-l-residents-portal
    branch: main
    plan: free
  # Must match Postgres region (block-l-db) or private DATABASE_URL won't resolve.
    region: oregon
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: BLOCK L RESIDENTS PORTAL
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: block-l-residents-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSET_URL
        fromService:
          name: block-l-residents-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/app/block-l.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public

# Optional: add Postgres later and set DATABASE_URL + DB_CONNECTION=pgsql